name: Scheduled Build Job UI e2e tests
on:
  workflow_call:
    inputs:
      node_version_file:
        description: 'Passed to setup-node action to specify where to source the version of node from'
        required: false
        type: string
        default: '.nvmrc'
      npm_version:
        description: "Passed to npm install so it knows which version of npm to install"
        required: false
        type: string
        default: "^12"
  schedule:
    - cron: "36 6 * * MON-FRI"
  workflow_dispatch:        
permissions:
  contents: read
jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hmpps-manage-a-workforce-ui-e2e-tests 
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ${{ inputs.node_version_file }}
      - name: Update npm
        shell: bash
        env:
          NPM_VERSION: ${{ inputs.npm_version }}
        run: |
          npm install -g "npm@$NPM_VERSION"

      - name: Install e2e dependencies
        run: npm install     

      - name: Checkout manage-a-workforce-ui
        uses: actions/checkout@v5
        with:
          repository: ministryofjustice/manage-a-workforce-ui
          path: manage-a-workforce-ui
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Start manage-a-workforce-ui
        run: |
          npm install
          npm run build
          npm run start-external-test &
        working-directory: manage-a-workforce-ui
      - name: Run docker compose
        run: |
          docker compose up -d  
      - name: Wait for maw-ui application to be ready
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:3007/health; then exit 0; fi
            sleep 5
          done
          echo "App failed to start" && exit 1

      - name: Install Chromium browser
        run: npx playwright install chromium

      - name: Run e2e tests
        run: npm run test:regression:chrome

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: e2e-test-results
         path: allure-results

      - name: docker compose down
        if: always()
        run: |
          docker compose down