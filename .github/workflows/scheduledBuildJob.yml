name: Scheduled Build Job UI e2e tests
on:
  schedule:
    - cron: "36 6 * * MON-FRI"
  workflow_dispatch:        
permissions:
  contents: read
jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hmpps-manage-a-workforce-ui-e2e-tests 
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Checkout manage-a-workforce-ui
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ministryofjustice/manage-a-workforce-ui
          path: manage-a-workforce-ui
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Update npm
        shell: bash
        run: |
          npm install -g "npm@12"

      - name: Install e2e dependencies
        run: npm install     

      - name: Start manage-a-workforce-ui
        run: |
          npm install
          npm run build
          npm run start-external-test &
        working-directory: manage-a-workforce-ui
      - name: Run docker compose
        run: |
          docker compose up -d  
      - name: Wait for maw-ui application to be ready
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:3007/health; then exit 0; fi
            sleep 5
          done
          echo "App failed to start" && exit 1

      - name: Install Chromium browser
        run: npx playwright install chromium

      - name: Run e2e tests
        run: npm run test:regression:chrome

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
         name: e2e-test-results
         path: allure-results

      - name: docker compose down
        if: always()
        run: |
          docker compose down
          